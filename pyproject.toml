[project]
name = "agentmailbus"
version = "0.1.0"
description = "LAN mailbox so a named agent on one host can message a named agent on another."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Aaron K. Clark" }]
dependencies = ["websockets>=13,<16"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentmailbus = "agentmailbus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
